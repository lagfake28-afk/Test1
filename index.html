<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Key Generated | Fake Lag</title>

    <style>

        :root{
            --bg:#06070d;
            --card:#11131c;
            --card2:#181b26;
            --text:#ffffff;
            --accent:#7c4dff;
            --accent2:#00e5ff;
        }

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            min-height:100vh;

            display:flex;
            justify-content:center;
            align-items:center;

            padding:20px;

            font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;

            background:
            radial-gradient(circle at top left,#7c4dff25,transparent 30%),
            radial-gradient(circle at bottom right,#00e5ff20,transparent 30%),
            linear-gradient(135deg,#05060a,#0d1018);

            overflow:hidden;
            color:var(--text);
        }

        body::before{
            content:"";

            position:absolute;
            inset:0;

            background-image:
            linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
            linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);

            background-size:35px 35px;

            opacity:.25;
        }

        .container{
            width:100%;
            max-width:430px;
            position:relative;
            z-index:2;
        }

        .card{
            position:relative;

            padding:38px 28px;

            border-radius:34px;

            background:
            linear-gradient(145deg,
            rgba(255,255,255,0.08),
            rgba(255,255,255,0.02));

            border:1px solid rgba(255,255,255,0.08);

            backdrop-filter:blur(20px);

            overflow:hidden;

            box-shadow:
            0 25px 60px rgba(0,0,0,0.55),
            0 0 50px rgba(124,77,255,0.18);
        }

        .card::before{
            content:"";

            position:absolute;
            width:180px;
            height:180px;

            background:radial-gradient(circle,
            rgba(124,77,255,0.35),
            transparent 70%);

            top:-70px;
            right:-70px;
        }

        .card::after{
            content:"";

            position:absolute;
            width:140px;
            height:140px;

            background:radial-gradient(circle,
            rgba(0,229,255,0.25),
            transparent 70%);

            bottom:-50px;
            left:-50px;
        }

        .key-icon{
            width:100px;
            height:100px;

            margin:0 auto 22px;

            border-radius:28px;

            overflow:hidden;

            position:relative;

            background:
            linear-gradient(135deg,
            rgba(124,77,255,0.35),
            rgba(0,229,255,0.25));

            padding:3px;

            box-shadow:
            0 10px 30px rgba(124,77,255,0.3);
        }

        .key-icon img{
            width:100%;
            height:100%;

            object-fit:cover;

            border-radius:25px;

            background:#0b0d14;
        }

        h1{
            text-align:center;

            font-size:32px;
            font-weight:900;

            margin-bottom:12px;

            letter-spacing:.5px;
        }

        .subtitle{
            text-align:center;

            color:#a8adbd;

            font-size:14px;
            line-height:1.7;

            margin-bottom:30px;
        }

        .success{
            width:fit-content;

            margin:0 auto 18px;

            padding:10px 18px;

            border-radius:999px;

            background:
            linear-gradient(135deg,
            rgba(124,77,255,0.18),
            rgba(0,229,255,0.15));

            border:1px solid rgba(255,255,255,0.08);

            color:#d9dfff;

            font-size:14px;
            font-weight:700;

            backdrop-filter:blur(10px);
        }

        .card-p{
            text-align:center;

            color:#8d93a7;

            font-size:14px;

            line-height:1.8;

            margin-bottom:28px;
        }

        .key-box{
            position:relative;

            background:
            linear-gradient(145deg,
            rgba(255,255,255,0.04),
            rgba(255,255,255,0.01));

            border:1px solid rgba(255,255,255,0.08);

            border-radius:22px;

            padding:24px 18px;

            margin-bottom:26px;

            overflow:hidden;
        }

        .key-box::before{
            content:"";

            position:absolute;
            inset:0;

            background:
            linear-gradient(90deg,
            transparent,
            rgba(255,255,255,0.05),
            transparent);

            transform:translateX(-100%);
            animation:shine 3s linear infinite;
        }

        @keyframes shine{
            100%{
                transform:translateX(100%);
            }
        }

        #finalKey{
            display:block;

            text-align:center;

            font-family:"Courier New",monospace;

            color:#ffffff;

            font-size:22px;
            font-weight:800;

            letter-spacing:3px;

            text-shadow:
            0 0 12px rgba(124,77,255,0.5);
        }

        .btn{
            width:100%;

            border:none;
            outline:none;

            padding:18px;

            border-radius:20px;

            cursor:pointer;

            font-size:15px;
            font-weight:800;

            color:#fff;

            background:
            linear-gradient(135deg,
            #7c4dff,
            #00b8ff);

            transition:.3s ease;

            box-shadow:
            0 12px 25px rgba(124,77,255,0.28);
        }

        .btn:hover{
            transform:translateY(-3px) scale(1.01);

            box-shadow:
            0 16px 35px rgba(124,77,255,0.4);
        }

        .footer{
            text-align:center;

            margin-top:24px;

            color:#5f6679;

            font-size:11px;

            letter-spacing:3px;
            text-transform:uppercase;
        }

        @media(max-width:480px){

            .card{
                padding:30px 20px;
            }

            h1{
                font-size:28px;
            }

            #finalKey{
                font-size:18px;
                letter-spacing:2px;
            }
        }

    </style>
</head>

<body>

<div class="container">

    <div class="card">

        <div class="key-icon">
            <img src="./assets/logo.png" alt="UKM">
        </div>

        <h1>Access Unlocked</h1>

        <p class="subtitle">
            Your device-locked license key is ready.
        </p>

        <div class="success">
            ✓ Generation Success
        </div>

        <p class="card-p">
            This key is locked to your device.
            Share it, and it won't work for others.
        </p>

        <div class="key-box">
            <span id="finalKey">SECURE FETCHING...</span>
        </div>

        <button class="btn" id="copyBtn" onclick="copyKey()">
            COPY TO CLIPBOARD
        </button>

    </div>

    <div class="footer">
        Fake Lag Security System
    </div>

</div>

<script>

async function generateLockedKey(){

    try{

        const response = await fetch('https://api.ipify.org?format=json');

        const data = await response.json();

        const ip = data.ip;

        const day = Math.floor(Date.now() / 86400000);

        const ipSeed = parseInt(
            ip.replace(/\./g, '').substring(0, 6)
        );

        let seed = ipSeed + day + 2026;

        function rnd(){

            let x = Math.sin(seed++) * 10000;

            return Math.abs(
                x - Math.floor(x)
            );
        }

        const chars =
        "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";

        let segments = [];

        for(let i=0; i<4; i++){

            let s = "";

            for(let j=0; j<4; j++){

                let r = Math.floor(
                    rnd() * chars.length
                );

                s += chars.charAt(r);
            }

            segments.push(s);
        }

        const finalKey =
        "UKM-" + segments.join("-");

        document.getElementById(
            'finalKey'
        ).innerText = finalKey;

    }

    catch(err){

        document.getElementById(
            'finalKey'
        ).innerText = "CONNECT TO INTERNET";
    }
}

function copyKey(){

    const keyText =
    document.getElementById(
        'finalKey'
    ).innerText;

    if(
        keyText.includes("SECURE") ||
        keyText.includes("CONNECT")
    ) return;

    navigator.clipboard.writeText(
        keyText
    ).then(() => {

        const btn =
        document.getElementById(
            'copyBtn'
        );

        btn.innerText =
        "COPIED SUCCESSFULLY! ✅";

        btn.style.background =
        "#00d084";

        setTimeout(() => {

            btn.innerText =
            "COPY TO CLIPBOARD";

            btn.style.background =
            "linear-gradient(135deg,#7c4dff,#00b8ff)";

        }, 2000);
    });
}

window.onload = generateLockedKey;

</script>

</body>
</html>
