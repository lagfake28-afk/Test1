<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nirob Dashboard</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#f5f5f5;
    color:#000;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    padding:20px;
}

.container{
    width:100%;
    max-width:420px;
    background:#fff;
    padding:25px;
    border-radius:15px;
    box-shadow:0 5px 20px rgba(0,0,0,0.15);
}

.logo{
    text-align:center;
    font-size:28px;
    font-weight:bold;
    margin-bottom:20px;
}

input{
    width:100%;
    padding:12px;
    margin-top:10px;
    border:1px solid #ccc;
    border-radius:10px;
    outline:none;
}

input:focus{
    border-color:#007bff;
}

button{
    width:100%;
    padding:12px;
    margin-top:12px;
    border:none;
    border-radius:10px;
    background:#007bff;
    color:#fff;
    font-size:15px;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    opacity:0.9;
}

.link-btn{
    display:block;
    text-align:center;
    text-decoration:none;
    margin-top:12px;
    color:#007bff;
    font-weight:bold;
}

#dashboard{
    display:none;
}

.section-title{
    margin-top:20px;
    margin-bottom:10px;
    font-weight:bold;
    font-size:18px;
}

#preview{
    width:100%;
    margin-top:15px;
    border-radius:10px;
    display:none;
    border:1px solid #ddd;
}

.success{
    margin-top:10px;
    color:green;
    text-align:center;
    font-weight:bold;
}
</style>
</head>

<body>

<!-- LOGIN PAGE -->
<div class="container" id="loginPage">

<div class="logo">NIROB PANEL</div>

<input type="password"
id="password"
placeholder="Enter Password">

<button onclick="login()">
LOGIN
</button>

<a href="https://t.me/YOUR_TELEGRAM"
target="_blank"
class="link-btn">
GET PASSWORD
</a>

</div>

<!-- DASHBOARD -->
<div class="container" id="dashboard">

<div class="logo">DASHBOARD</div>

<div class="section-title">
Team Information
</div>

<input type="text"
id="teamCode"
placeholder="Team Code">

<input type="text"
id="uid"
placeholder="UID">

<input type="text"
id="emoteId"
placeholder="Emote ID">

<button onclick="submitMod()">
MOD
</button>

<div class="section-title">
Image Settings
</div>

<input type="file"
id="imageFile"
accept="image/*">

<input type="text"
id="imageCode"
placeholder="Image URL / Image Code">

<button onclick="saveImage()">
SAVE IMAGE
</button>

<img id="preview">

<div id="status" class="success"></div>

</div>

<script>

const PASSWORD = "123456";

function login(){

    let pass =
    document.getElementById("password").value;

    if(pass === PASSWORD){

        document.getElementById("loginPage")
        .style.display = "none";

        document.getElementById("dashboard")
        .style.display = "block";

    }else{

        alert("Wrong Password");

    }
}

function saveImage(){

    const file =
    document.getElementById("imageFile")
    .files[0];

    const imageCode =
    document.getElementById("imageCode")
    .value;

    if(file){

        const reader = new FileReader();

        reader.onload = function(e){

            const preview =
            document.getElementById("preview");

            preview.src =
            e.target.result;

            preview.style.display =
            "block";
        };

        reader.readAsDataURL(file);
    }

    document.getElementById("status")
    .innerHTML =
    "Image Saved Successfully";

    console.log("Image Code:", imageCode);
}

function submitMod(){

    const teamCode =
    document.getElementById("teamCode").value;

    const uid =
    document.getElementById("uid").value;

    const emoteId =
    document.getElementById("emoteId").value;

    alert(
        "Team Code: " + teamCode +
        "\nUID: " + uid +
        "\nEmote ID: " + emoteId
    );

}
</script>

</body>
</html>
