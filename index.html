<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AxenMod Panel</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#f5f5f5;
    color:#000;
}

.header{
    background:#fff;
    padding:15px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    box-shadow:0 2px 10px rgba(0,0,0,.1);
}

.container{
    max-width:900px;
    margin:auto;
    padding:20px;
}

.card{
    background:#fff;
    border-radius:12px;
    padding:15px;
    margin-bottom:15px;
    box-shadow:0 2px 10px rgba(0,0,0,.08);
}

input{
    width:100%;
    padding:12px;
    margin:6px 0;
    border:1px solid #ccc;
    border-radius:8px;
}

button{
    width:100%;
    padding:12px;
    border:none;
    border-radius:8px;
    cursor:pointer;
    background:#000;
    color:#fff;
    margin-top:6px;
}

button:hover{
    opacity:.9;
}

#dashboard,
#adminPanel{
    display:none;
}

img{
    width:100%;
    border-radius:10px;
}

.emote{
    border:1px solid #ddd;
    padding:10px;
    border-radius:10px;
    margin-top:10px;
}

.deleteBtn{
    background:red;
    margin-top:10px;
}

.telegram{
    display:block;
    margin-top:10px;
    text-decoration:none;
    color:#0066ff;
}
</style>
</head>

<body>

<div class="header">
    <b id="siteTitle">AxenMod Panel</b>
    <button style="width:auto;padding:10px 15px;" onclick="adminLogin()">
        ⚙ Admin
    </button>
</div>

<div class="container">

    <!-- Login -->
    <div id="login" class="card">
        <h3>User Login</h3>

        <input
            type="password"
            id="userPass"
            placeholder="Password">

        <button onclick="login()">
            Login
        </button>

        <a class="telegram"
           href="https://t.me/axenmod"
           target="_blank">
           Get Password
        </a>
    </div>

    <!-- Dashboard -->
    <div id="dashboard">

        <div class="card">

            <img id="banner"
                 src="https://via.placeholder.com/800x250?text=Banner">

            <h2 id="titleView"
                style="margin:10px 0;">
                AxenMod Panel
            </h2>

            <input placeholder="Team Code">
            <input placeholder="UID">

            <div id="emotes"></div>

            <button>
                Send (Demo)
            </button>

        </div>

    </div>

    <!-- Admin -->
    <div id="adminPanel" class="card">

        <h3>Admin Panel</h3>

        <input
            id="newTitle"
            placeholder="Website Name">

        <input
            id="newBanner"
            placeholder="Banner Image URL">

        <button onclick="saveSettings()">
            Save Settings
        </button>

        <hr style="margin:15px 0;">

        <input
            id="emoteName"
            placeholder="Emote Name">

        <input
            id="emoteImage"
            placeholder="Emote Image URL">

        <button onclick="addEmote()">
            Add Emote
        </button>

        <div id="adminEmotes"></div>

    </div>

</div>

<script>

const USER_PASS = "123456";
const ADMIN_PASS = "admin123";

let emotes =
JSON.parse(
localStorage.getItem("emotes") || "[]"
);

function login(){

    const pass =
    document.getElementById("userPass").value;

    if(pass === USER_PASS){

        document.getElementById("login").style.display="none";

        document.getElementById("dashboard").style.display="block";

    }else{

        alert("Wrong Password");

    }

}

function adminLogin(){

    const pass =
    prompt("Enter Admin Password");

    if(pass === null) return;

    if(pass === ADMIN_PASS){

        document.getElementById("adminPanel").style.display="block";

    }else{

        alert("Wrong Password");

    }

}

function addEmote(){

    const name =
    document.getElementById("emoteName").value;

    const img =
    document.getElementById("emoteImage").value;

    if(!name || !img){

        alert("Fill all fields");
        return;

    }

    emotes.push({
        name:name,
        img:img
    });

    localStorage.setItem(
        "emotes",
        JSON.stringify(emotes)
    );

    document.getElementById("emoteName").value="";
    document.getElementById("emoteImage").value="";

    render();

}

function delEmote(index){

    emotes.splice(index,1);

    localStorage.setItem(
        "emotes",
        JSON.stringify(emotes)
    );

    render();

}

function saveSettings(){

    const title =
    document.getElementById("newTitle").value;

    const banner =
    document.getElementById("newBanner").value;

    if(title){

        localStorage.setItem(
            "title",
            title
        );

    }

    if(banner){

        localStorage.setItem(
            "banner",
            banner
        );

    }

    render();

    alert("Saved");

}

function render(){

    const emotesBox =
    document.getElementById("emotes");

    const adminBox =
    document.getElementById("adminEmotes");

    emotesBox.innerHTML="";
    adminBox.innerHTML="";

    emotes.forEach((item,index)=>{

        emotesBox.innerHTML += `
        <div class="emote">
            <img src="${item.img}">
            <h4>${item.name}</h4>
        </div>
        `;

        adminBox.innerHTML += `
        <div class="emote">
            <b>${item.name}</b>
            <button
            class="deleteBtn"
            onclick="delEmote(${index})">
            Delete
            </button>
        </div>
        `;

    });

    const title =
    localStorage.getItem("title")
    || "AxenMod Panel";

    const banner =
    localStorage.getItem("banner")
    || "https://via.placeholder.com/800x250?text=Banner";

    document.getElementById("siteTitle").textContent =
    title;

    document.getElementById("titleView").textContent =
    title;

    document.getElementById("banner").src =
    banner;

}

render();

</script>

</body>
</html>
