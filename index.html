<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Key Generated | Fake Lag</title>

    <style>
        :root{
            --bg:#000000;
            --card:#121212;
            --text:#ffffff;
            --accent:#00ff88;
        }

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            background:
            radial-gradient(circle at top left,#00ff8820,transparent 30%),
            radial-gradient(circle at bottom right,#00aaff20,transparent 30%),
            var(--bg);

            color:var(--text);
            font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;

            display:flex;
            justify-content:center;
            align-items:center;

            min-height:100vh;
            padding:20px;
        }

        .container{
            width:100%;
            max-width:420px;
            text-align:center;
        }

        .card{
            background:rgba(18,18,18,0.9);
            border:1px solid rgba(255,255,255,0.08);
            border-radius:30px;
            padding:35px 28px;
            backdrop-filter:blur(15px);

            box-shadow:
            0 15px 40px rgba(0,0,0,0.6),
            0 0 30px rgba(0,255,136,0.08);
        }

        .key-icon{
            width:95px;
            height:95px;

            border-radius:50%;
            overflow:hidden;

            margin:0 auto 20px;

            border:2px solid rgba(255,255,255,0.08);

            box-shadow:
            0 0 20px rgba(0,255,136,0.15);
        }

        .key-icon img{
            width:100%;
            height:100%;
            object-fit:cover;
        }

        h1{
            font-size:30px;
            margin-bottom:10px;
            font-weight:800;
        }

        .subtitle{
            color:#999;
            font-size:14px;
            line-height:1.6;
            margin-bottom:30px;
        }

        .success{
            color:var(--accent);
            font-size:22px;
            font-weight:700;
            margin-bottom:12px;
        }

        .card-p{
            color:#888;
            font-size:14px;
            line-height:1.6;
            margin-bottom:25px;
        }

        .key-box{
            background:#050505;
            border:1px dashed var(--accent);

            border-radius:18px;

            padding:22px;
            margin-bottom:25px;

            overflow:hidden;
        }

        #finalKey{
            color:var(--accent);

            font-family:"Courier New",monospace;
            font-size:20px;
            font-weight:bold;

            letter-spacing:2px;
            word-break:break-word;
        }

        .btn{
            width:100%;

            padding:18px;

            border:none;
            border-radius:18px;

            background:linear-gradient(135deg,#00ff88,#00ccff);

            color:#000;

            font-size:16px;
            font-weight:800;

            cursor:pointer;

            transition:0.3s ease;
        }

        .btn:hover{
            transform:translateY(-2px) scale(1.01);

            box-shadow:
            0 10px 25px rgba(0,255,136,0.25);
        }

        .footer{
            margin-top:25px;

            color:#444;

            font-size:11px;

            letter-spacing:2px;
            text-transform:uppercase;
        }

        @media(max-width:480px){

            .card{
                padding:28px 20px;
            }

            h1{
                font-size:26px;
            }

            #finalKey{
                font-size:17px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="card">

        <div class="key-icon">
            <img src="./assets/logo.png" alt="UKM">
        </div>

        <h1>Access Unlocked</h1>

        <p class="subtitle">
            Your device-locked license key is ready.
        </p>

        <div class="success">
            Generation Success!
        </div>

        <p class="card-p">
            This key is locked to your device.
            Share it, and it won't work for others.
        </p>

        <div class="key-box">
            <span id="finalKey">SECURE FETCHING...</span>
        </div>

        <button class="btn" id="copyBtn" onclick="copyKey()">
            COPY TO CLIPBOARD
        </button>

    </div>

    <div class="footer">
        Fake Lag Security System
    </div>

</div>

<script>

async function generateLockedKey(){

    try{

        const response = await fetch('https://api.ipify.org?format=json');

        const data = await response.json();

        const ip = data.ip;

        const day = Math.floor(Date.now() / 86400000);

        const ipSeed = parseInt(
            ip.replace(/\./g, '').substring(0, 6)
        );

        let seed = ipSeed + day + 2026;

        function rnd(){

            let x = Math.sin(seed++) * 10000;

            return Math.abs(
                x - Math.floor(x)
            );
        }

        const chars =
        "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";

        let segments = [];

        for(let i=0; i<4; i++){

            let s = "";

            for(let j=0; j<4; j++){

                let r = Math.floor(
                    rnd() * chars.length
                );

                s += chars.charAt(r);
            }

            segments.push(s);
        }

        const finalKey =
        "UKM-" + segments.join("-");

        document.getElementById(
            'finalKey'
        ).innerText = finalKey;

    }

    catch(err){

        document.getElementById(
            'finalKey'
        ).innerText = "CONNECT TO INTERNET";
    }
}

function copyKey(){

    const keyText =
    document.getElementById(
        'finalKey'
    ).innerText;

    if(
        keyText.includes("SECURE") ||
        keyText.includes("CONNECT")
    ) return;

    navigator.clipboard.writeText(
        keyText
    ).then(() => {

        const btn =
        document.getElementById(
            'copyBtn'
        );

        btn.innerText =
        "COPIED SUCCESSFULLY! ✅";

        btn.style.background =
        "#00ff88";

        setTimeout(() => {

            btn.innerText =
            "COPY TO CLIPBOARD";

            btn.style.background =
            "linear-gradient(135deg,#00ff88,#00ccff)";

        }, 2000);
    });
}

window.onload = generateLockedKey;

</script>

</body>
</html>
